name: Build and Publish OpenWrt Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; do not cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - x86_64
          - mipsel_24kc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build APK packages with OpenWrt SDK action
        uses: openwrt/gh-action-sdk@v10
        env:
          ARCH: "${{ matrix.arch }}-openwrt-25.12"
          FEEDNAME: boinc-openwrt
          PACKAGES: "boinc period-search"
          PRIVATE_KEY: "${{ secrets.SIGNING_KEY }}"
          INDEX: 1

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/boinc-openwrt/
          if-no-files-found: warn

  index:
    name: Generate repository index
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: false

      - name: Assemble site from per-architecture artifacts
        run: |
          mkdir -p site

          shopt -s nullglob
          arch_dirs=(dist/packages-*/)
          if [ ${#arch_dirs[@]} -eq 0 ]; then
            echo "No package artifacts found"
            exit 1
          fi

          for arch_dir in "${arch_dirs[@]}"; do
            arch=$(basename "$arch_dir" | sed 's/packages-//')
            echo "--- Setting up site for: ${arch} ---"
            mkdir -p "site/${arch}"

            cp -a "${arch_dir}"/. "site/${arch}/"
          done

      - name: Export public key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$RUNNER_TEMP/private-key.pem"
          chmod 600 "$RUNNER_TEMP/private-key.pem"
          openssl ec -in "$RUNNER_TEMP/private-key.pem" -pubout -out site/public-key.pem
          chmod 644 site/public-key.pem
          rm -f "$RUNNER_TEMP/private-key.pem"

      - name: Generate index.html
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>boinc-openwrt — OpenWrt Package Repository</title>
            <style>
              body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              pre  { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
              code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 2px; }
            </style>
          </head>
          <body>
            <h1>boinc-openwrt Package Repository</h1>
            <p>Custom OpenWrt packages built with openwrt/gh-action-sdk for OpenWrt 25.12.</p>

            <h2>Available packages</h2>
            <ul>
              <li><strong>boinc</strong> — BOINC distributed computing client</li>
              <li><strong>period-search</strong> — Asteroids@home Period Search BOINC application</li>
            </ul>

            <h2>Supported architectures</h2>
            <ul>
              <li><a href="aarch64_cortex-a53/">aarch64_cortex-a53</a></li>
              <li><a href="x86_64/">x86_64</a></li>
              <li><a href="mipsel_24kc/">mipsel_24kc</a></li>
            </ul>

            <h2>Usage</h2>
            <p>Replace <code>ARCH</code> with your device architecture.</p>

            <p>Step 1 — trust the repository signing key (one-time setup):</p>
            <pre>wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem</pre>

            <p>Step 2 — install packages:</p>
            <pre>apk add --repository https://hectorespert.github.io/boinc-openwrt/ARCH/packages.adb boinc period-search</pre>

            <p>Architecture-specific examples:</p>
            <pre># aarch64 (e.g. Raspberry Pi 3/4 with OpenWrt)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a53/packages.adb boinc

          # x86_64 (e.g. PC/server)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/x86_64/packages.adb boinc

          # mipsel (e.g. many home routers)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/mipsel_24kc/packages.adb boinc</pre>

            <p>
              Source code:
              <a href="https://github.com/hectorespert/boinc-openwrt">
                github.com/hectorespert/boinc-openwrt
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: index

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
