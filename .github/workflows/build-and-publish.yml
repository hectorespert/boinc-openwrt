name: Build and Publish OpenWrt Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; do not cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - x86_64
          - mipsel_24kc
          - mips_mips32
          - riscv64_generic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode signing key
        env:
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            DECODED=$(echo "$SIGNING_KEY" | base64 -d)
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "$DECODED"
            echo "PRIVATE_KEY<<EOF" >> "$GITHUB_ENV"
            echo "$DECODED" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: Build APK packages with OpenWrt SDK action
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: "${{ matrix.arch }}-openwrt-25.12"
          FEEDNAME: boinc_openwrt
          PACKAGES: "boinc-upstream period-search binary-radio-pulsar-search fftw3 gsl libxml2-static"
          PRIVATE_KEY: ${{ env.PRIVATE_KEY }}
          INDEX: 1

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/boinc_openwrt/
          if-no-files-found: warn

  index:
    name: Generate repository index
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: false

      - name: Assemble site from per-architecture artifacts
        run: |
          mkdir -p site

          shopt -s nullglob
          arch_dirs=(dist/packages-*/)
          if [ ${#arch_dirs[@]} -eq 0 ]; then
            echo "No package artifacts found"
            exit 1
          fi

          for arch_dir in "${arch_dirs[@]}"; do
            arch=$(basename "$arch_dir" | sed 's/packages-//')
            echo "--- Setting up site for: ${arch} ---"
            mkdir -p "site/${arch}"

            cp -a "${arch_dir}"/. "site/${arch}/"
          done

      - name: Export public key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$RUNNER_TEMP/private-key.pem"
          chmod 600 "$RUNNER_TEMP/private-key.pem"
          openssl ec -in "$RUNNER_TEMP/private-key.pem" -pubout -out site/public-key.pem
          chmod 644 site/public-key.pem
          rm -f "$RUNNER_TEMP/private-key.pem"

      - name: Generate index.html
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>boinc-openwrt — OpenWrt Package Repository</title>
            <style>
              body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              pre  { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
              code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 2px; }
            </style>
          </head>
          <body>
            <h1>boinc-openwrt Package Repository</h1>
            <p>Custom OpenWrt packages built with openwrt/gh-action-sdk for OpenWrt 25.12.</p>

            <h2>Available packages</h2>
            <ul>
              <li><strong>boinc-upstream</strong> — BOINC client (upstream, tracks BOINC releases directly)</li>
              <li><strong>period-search</strong> — Asteroids@home Period Search BOINC application</li>
              <li><strong>binary-radio-pulsar-search</strong> — Einstein@Home Binary Radio Pulsar Search BOINC application (CPU)</li>
            </ul>

            <h2>Supported architectures</h2>
            <ul>
              <li><a href="aarch64_cortex-a53/">aarch64_cortex-a53</a></li>
              <li><a href="aarch64_cortex-a72/">aarch64_cortex-a72</a></li>
              <li><a href="aarch64_cortex-a76/">aarch64_cortex-a76</a></li>
              <li><a href="aarch64_generic/">aarch64_generic</a></li>
              <li><a href="x86_64/">x86_64</a></li>
              <li><a href="mipsel_24kc/">mipsel_24kc</a></li>
              <li><a href="mips_mips32/">mips_mips32</a></li>
              <li><a href="riscv64_generic/">riscv64_generic</a></li>
            </ul>

            <h2>Usage</h2>
            <p>Replace <code>ARCH</code> with your device architecture.</p>

            <p>Step 1 — trust the repository signing key (one-time setup):</p>
            <pre>wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem</pre>

            <p>Step 2 — install packages:</p>
            <pre>apk add --repository https://hectorespert.github.io/boinc-openwrt/ARCH/packages.adb boinc-upstream period-search binary-radio-pulsar-search</pre>

            <p>Architecture-specific examples:</p>
            <pre># aarch64 Cortex-A53 (e.g. Raspberry Pi 3 with OpenWrt)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
            apk add --repository https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a53/packages.adb boinc-upstream period-search binary-radio-pulsar-search

          # aarch64 Cortex-A72 (e.g. Raspberry Pi 4 with OpenWrt)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a72/packages.adb boinc-upstream period-search binary-radio-pulsar-search

          # aarch64 Cortex-A76 (e.g. Raspberry Pi 5 with OpenWrt)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a76/packages.adb boinc-upstream period-search binary-radio-pulsar-search

          # aarch64 generic (e.g. generic ARM64 device)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/aarch64_generic/packages.adb boinc-upstream period-search binary-radio-pulsar-search

          # x86_64 (e.g. PC/server)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/x86_64/packages.adb boinc-upstream period-search binary-radio-pulsar-search

          # mipsel (e.g. many home routers)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/mipsel_24kc/packages.adb boinc-upstream period-search

          # bmips/mips32 (e.g. Broadcom MIPS routers)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/mips_mips32/packages.adb boinc-upstream period-search

          # riscv64 (e.g. generic RISC-V 64-bit device)
          wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem
          apk add --repository https://hectorespert.github.io/boinc-openwrt/riscv64_generic/packages.adb boinc-upstream period-search binary-radio-pulsar-search</pre>

            <h2>Add as custom feed</h2>
            <p>
              To permanently add this repository as a custom feed so you can install packages without
              specifying <code>--repository</code> each time, follow the
              <a href="https://openwrt.org/docs/guide-user/additional-software/apk#repository_feeds">OpenWrt APK repository feeds documentation</a>:
            </p>

            <p>Step 1 — trust the repository signing key (one-time setup):</p>
            <pre>wget -P /etc/apk/keys/ https://hectorespert.github.io/boinc-openwrt/public-key.pem</pre>

            <p>Step 2 — add the feed to <code>/etc/apk/repositories.d/customfeeds.list</code> (replace <code>ARCH</code> with your architecture):</p>
            <pre>echo "https://hectorespert.github.io/boinc-openwrt/ARCH/packages.adb" >> /etc/apk/repositories.d/customfeeds.list</pre>

            <p>Architecture-specific examples:</p>
            <pre># aarch64 Cortex-A53 (e.g. Raspberry Pi 3 with OpenWrt)
          echo "https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a53/packages.adb" >> /etc/apk/repositories.d/customfeeds.list

          # aarch64 Cortex-A72 (e.g. Raspberry Pi 4 with OpenWrt)
          echo "https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a72/packages.adb" >> /etc/apk/repositories.d/customfeeds.list

          # aarch64 Cortex-A76 (e.g. Raspberry Pi 5 with OpenWrt)
          echo "https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a76/packages.adb" >> /etc/apk/repositories.d/customfeeds.list

          # aarch64 generic (e.g. generic ARM64 device)
          echo "https://hectorespert.github.io/boinc-openwrt/aarch64_generic/packages.adb" >> /etc/apk/repositories.d/customfeeds.list

          # x86_64 (e.g. PC/server)
          echo "https://hectorespert.github.io/boinc-openwrt/x86_64/packages.adb" >> /etc/apk/repositories.d/customfeeds.list

          # mipsel (e.g. many home routers)
          echo "https://hectorespert.github.io/boinc-openwrt/mipsel_24kc/packages.adb" >> /etc/apk/repositories.d/customfeeds.list

          # bmips/mips32 (e.g. Broadcom MIPS routers)
          echo "https://hectorespert.github.io/boinc-openwrt/mips_mips32/packages.adb" >> /etc/apk/repositories.d/customfeeds.list

          # riscv64 (e.g. generic RISC-V 64-bit device)
          echo "https://hectorespert.github.io/boinc-openwrt/riscv64_generic/packages.adb" >> /etc/apk/repositories.d/customfeeds.list</pre>

            <p>Step 3 — update the package index and install:</p>
            <pre>apk update
          apk add boinc-upstream period-search</pre>

            <p>
              Source code:
              <a href="https://github.com/hectorespert/boinc-openwrt">
                github.com/hectorespert/boinc-openwrt
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Generate robots.txt
        run: |
          cat > site/robots.txt << 'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://hectorespert.github.io/boinc-openwrt/sitemap.xml
          EOF

      - name: Generate sitemap.xml
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url>'
            echo '    <loc>https://hectorespert.github.io/boinc-openwrt/</loc>'
            echo '    <changefreq>weekly</changefreq>'
            echo '    <priority>1.0</priority>'
            echo '  </url>'
            for arch_dir in site/*/; do
              arch=$(basename "$arch_dir")
              echo '  <url>'
              echo "    <loc>https://hectorespert.github.io/boinc-openwrt/${arch}/</loc>"
              echo '    <changefreq>weekly</changefreq>'
              echo '    <priority>0.8</priority>'
              echo '  </url>'
            done
            echo '</urlset>'
          } > site/sitemap.xml

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: index

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
