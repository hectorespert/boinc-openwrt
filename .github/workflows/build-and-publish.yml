name: Build and Publish OpenWrt Packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; do not cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Build packages for each architecture using the OpenWrt 25.12 SDK
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: armsr/armv8
          - arch: x86_64
            target: x86/64
          - arch: mipsel_24kc
            target: ramips/mt7621

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            xsltproc \
            rsync \
            wget \
            unzip \
            python3 \
            zstd

      - name: Download OpenWrt 25.12 SDK
        run: |
          TARGET="${{ matrix.target }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}"
          # Discover the current SDK filename from the snapshot index
          SDK_FILE=$(wget -qO- "${BASE_URL}/" \
            | grep -oP 'openwrt-sdk[^"]*Linux-x86_64\.tar\.zst' \
            | head -1)
          echo "Downloading SDK: ${SDK_FILE}"
          wget -q "${BASE_URL}/${SDK_FILE}" -O sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Configure SDK feed
        working-directory: sdk
        run: |
          # Point the custom feed at this repository.
          # Only boinc and period-search will be installed (pla-util is excluded).
          echo "src-link custom ${{ github.workspace }}" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install boinc period-search

      - name: Compile packages
        working-directory: sdk
        run: |
          make defconfig
          make package/boinc/compile -j$(nproc) V=s
          make package/period-search/compile -j$(nproc) V=s

      - name: Collect built .apk files
        run: |
          mkdir -p dist
          find sdk/bin/packages -name "*.apk" -exec cp {} dist/ \;
          echo "Packages collected:"
          ls dist/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: warn

      - name: Upload host apk binary
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: host-apk
          path: sdk/staging_dir/host/bin/apk
          if-no-files-found: error

      - name: Prepare and upload SDK build key
        if: matrix.arch == 'x86_64'
        run: |
          KEY_PUB="sdk/key-build.pub"
          KEY_PRIV="sdk/key-build"

          # Derive the public key from the private key when only the private
          # key is present (some snapshot SDKs omit key-build.pub).
          if [ ! -f "$KEY_PUB" ] && [ -f "$KEY_PRIV" ]; then
            echo "Deriving public key from private key..."
            openssl rsa  -in "$KEY_PRIV" -pubout -out "$KEY_PUB" \
              || openssl pkey -in "$KEY_PRIV" -pubout -out "$KEY_PUB" \
              || echo "WARNING: openssl could not derive public key from $KEY_PRIV"
          fi

          if [ ! -f "$KEY_PUB" ]; then
            echo "ERROR: key-build.pub not found and could not be derived."
            echo "=== sdk/ root ==="
            ls -la sdk/ || true
            echo "=== key-build* files ==="
            find sdk/ -name "key-build*" 2>/dev/null || true
            exit 1
          fi
          echo "SDK build key ready: $KEY_PUB"

      - name: Upload SDK build key
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build-key
          path: sdk/key-build.pub
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: Generate APK repository index and GitHub Pages site
  # ──────────────────────────────────────────────────────────────────────────
  index:
    name: Generate repository index
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download host apk binary
        uses: actions/download-artifact@v4
        with:
          name: host-apk
          path: /tmp/host-apk/

      - name: Download SDK build key
        uses: actions/download-artifact@v4
        with:
          name: sdk-build-key
          path: /tmp/sdk-key/

      - name: Install apk
        run: sudo install -m 755 /tmp/host-apk/apk /usr/local/bin/apk

      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist/
          merge-multiple: false

      - name: Generate RSA signing key
        run: |
          # NOTE: This generates a new key on every run.
          # For production use, store the private key as a GitHub Secret named
          # APK_SIGNING_KEY and replace this step with:
          #
          #   - name: Load signing key
          #     run: echo "${{ secrets.APK_SIGNING_KEY }}" > private.pem
          #
          # Then add the corresponding public key to the repository so that
          # users only need to trust it once.
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem
          KEY_ID=$(openssl rsa -in private.pem -pubout -outform DER \
            | sha256sum | head -c 16)
          echo "KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"
          echo "Signing key ID: ${KEY_ID}"

      - name: Generate APKINDEX for each architecture
        run: |
          # Set up a root directory that trusts the SDK build key.
          # The key was used to sign the packages during compilation.
          mkdir -p /tmp/apkroot/etc/apk/keys
          cp /tmp/sdk-key/key-build.pub /tmp/apkroot/etc/apk/keys/

          mkdir -p site
          for arch_dir in dist/packages-*/; do
            arch=$(basename "$arch_dir" | sed 's/packages-//')
            echo "--- Generating index for: ${arch} ---"
            mkdir -p "site/${arch}"

            # Copy .apk files for this architecture
            pkg_count=$(find "$arch_dir" -name "*.apk" | wc -l)
            if [ "$pkg_count" -eq 0 ]; then
              echo "No packages found for ${arch}, skipping."
              continue
            fi
            find "$arch_dir" -name "*.apk" -exec cp {} "site/${arch}/" \;

            # Generate the APKINDEX
            (cd "site/${arch}" && \
              apk --root /tmp/apkroot index \
                --rewrite-arch "${arch}" \
                -o APKINDEX.tar.gz \
                *.apk)

            # Sign the index with the RSA private key
            # The signature is stored alongside the index so that apk can
            # verify it when fetching the repository.
            openssl dgst -sha256 \
              -sign private.pem \
              -out "site/${arch}/APKINDEX.tar.gz.sig" \
              "site/${arch}/APKINDEX.tar.gz"

            # Publish the public key inside each architecture directory so
            # users can import it with:  apk add --allow-untrusted ...
            # or copy it to /etc/apk/keys/ on their device.
            cp public.pem "site/${arch}/repo-${KEY_ID}.pub"
          done

      - name: Generate index.html
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>boinc-openwrt — OpenWrt Package Repository</title>
            <style>
              body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
              pre  { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
              code { background: #f4f4f4; padding: 0.1rem 0.3rem; border-radius: 2px; }
            </style>
          </head>
          <body>
            <h1>boinc-openwrt Package Repository</h1>
            <p>Custom OpenWrt packages built for OpenWrt 25.12+.</p>

            <h2>Available packages</h2>
            <ul>
              <li><strong>boinc</strong> — BOINC distributed computing client</li>
              <li><strong>period-search</strong> — Asteroids@home Period Search BOINC application</li>
            </ul>

            <h2>Supported architectures</h2>
            <ul>
              <li><a href="aarch64_cortex-a53/">aarch64_cortex-a53</a></li>
              <li><a href="x86_64/">x86_64</a></li>
              <li><a href="mipsel_24kc/">mipsel_24kc</a></li>
            </ul>

            <h2>Usage</h2>
            <p>Replace <code>ARCH</code> with your device architecture:</p>
            <pre>apk add --repository https://hectorespert.github.io/boinc-openwrt/ARCH boinc</pre>

            <p>Architecture-specific examples:</p>
            <pre># aarch64 (e.g. Raspberry Pi 3/4 with OpenWrt)
          apk add --repository https://hectorespert.github.io/boinc-openwrt/aarch64_cortex-a53 boinc

          # x86_64 (e.g. PC/server)
          apk add --repository https://hectorespert.github.io/boinc-openwrt/x86_64 boinc

          # mipsel (e.g. many home routers)
          apk add --repository https://hectorespert.github.io/boinc-openwrt/mipsel_24kc boinc</pre>

            <p>
              Source code:
              <a href="https://github.com/hectorespert/boinc-openwrt">
                github.com/hectorespert/boinc-openwrt
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to GitHub Pages
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: index

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
