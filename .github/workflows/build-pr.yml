name: Build OpenWrt Packages (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4
          - x86_64
          - riscv64_generic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build APK packages with OpenWrt SDK action
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: "${{ matrix.arch }}-openwrt-25.12"
          FEEDNAME: boinc_openwrt
          PACKAGES: "boinc-upstream period-search binary-radio-pulsar-search fftw3 gsl libxml2-static"

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: bin/packages/${{ matrix.arch }}/boinc_openwrt/
          if-no-files-found: warn
