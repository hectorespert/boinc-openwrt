name: Build OpenWrt Packages (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Build packages for each architecture using the OpenWrt 25.12 SDK
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: armsr/armv8
          - arch: x86_64
            target: x86/64
          - arch: mipsel_24kc
            target: ramips/mt7621

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            xsltproc \
            rsync \
            wget \
            unzip \
            python3 \
            zstd

      - name: Download OpenWrt 25.12 SDK
        run: |
          TARGET="${{ matrix.target }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}"
          # Discover the current SDK filename from the snapshot index
          SDK_FILE=$(wget -qO- "${BASE_URL}/" \
            | grep -oP 'openwrt-sdk[^"]*Linux-x86_64\.tar\.zst' \
            | head -1)
          echo "Downloading SDK: ${SDK_FILE}"
          wget -q "${BASE_URL}/${SDK_FILE}" -O sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Configure SDK feed
        working-directory: sdk
        run: |
          # Point the custom feed at this repository.
          # Only boinc and period-search will be installed (pla-util is excluded).
          echo "src-link custom ${{ github.workspace }}" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install boinc period-search

      - name: Compile packages
        working-directory: sdk
        run: |
          make defconfig
          make package/boinc/compile -j$(nproc) V=s
          make package/period-search/compile -j$(nproc) V=s

      - name: Collect built .apk files
        run: |
          mkdir -p dist
          find sdk/bin/packages -name "*.apk" -exec cp {} dist/ \;
          echo "Packages collected:"
          ls dist/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: warn

      - name: Test apk index generation
        if: matrix.arch == 'x86_64'
        run: |
          APK="$GITHUB_WORKSPACE/sdk/staging_dir/host/bin/apk"
          if [ ! -x "$APK" ]; then
            echo "ERROR: apk binary not found at $APK"
            exit 1
          fi
          echo "apk version: $("$APK" --version)"

          # Locate the APK signing public key produced by the SDK build system.
          # OpenWrt normally generates sdk/key-build (private) and sdk/key-build.pub
          # (public) on the first package compilation.  Some snapshot SDKs ship only
          # the private key; in that case derive the public key with openssl.
          KEY_PUB="$GITHUB_WORKSPACE/sdk/key-build.pub"
          KEY_PRIV="$GITHUB_WORKSPACE/sdk/key-build"

          if [ ! -f "$KEY_PUB" ] && [ -f "$KEY_PRIV" ]; then
            echo "key-build.pub missing; deriving from private key..."
            openssl rsa  -in "$KEY_PRIV" -pubout -out "$KEY_PUB" \
              || openssl pkey -in "$KEY_PRIV" -pubout -out "$KEY_PUB" \
              || echo "WARNING: openssl could not derive public key from $KEY_PRIV"
          fi

          # Broader search: look for any *.pub file in the SDK tree
          # (excluding heavyweight build/download subdirs).
          if [ ! -f "$KEY_PUB" ]; then
            echo "sdk/key-build.pub still missing; searching SDK tree..."
            FOUND=$(find "$GITHUB_WORKSPACE/sdk" \
              \( -name "key-build.pub" -o -name "*.rsa.pub" \) \
              -not -path "*/build_dir/*" \
              -not -path "*/dl/*" \
              2>/dev/null | head -1)
            [ -n "$FOUND" ] && KEY_PUB="$FOUND"
          fi

          if [ ! -f "$KEY_PUB" ]; then
            echo "ERROR: Could not locate the SDK signing key."
            echo "=== sdk/ root listing ==="
            ls -la "$GITHUB_WORKSPACE/sdk/" || true
            echo "=== key-build* files anywhere in SDK ==="
            find "$GITHUB_WORKSPACE/sdk" -name "key-build*" 2>/dev/null || true
            echo "=== *.pub files in staging_dir/host ==="
            find "$GITHUB_WORKSPACE/sdk/staging_dir/host" -name "*.pub" 2>/dev/null || true
            exit 1
          fi

          echo "Using signing key: $KEY_PUB"
          mkdir -p /tmp/apkroot/etc/apk/keys
          cp "$KEY_PUB" /tmp/apkroot/etc/apk/keys/

          mkdir -p /tmp/apktest
          find dist/ -name "*.apk" -exec cp {} /tmp/apktest/ \;
          (cd /tmp/apktest && "$APK" --root /tmp/apkroot index \
            --rewrite-arch x86_64 -o APKINDEX.tar.gz *.apk)
          echo "APKINDEX generated successfully:"
          ls -lh /tmp/apktest/
