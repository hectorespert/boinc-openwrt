name: Build OpenWrt Packages (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Build packages for each architecture using the OpenWrt 25.12 SDK
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            target: armsr/armv8
          - arch: x86_64
            target: x86/64
          - arch: mipsel_24kc
            target: ramips/mt7621

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            xsltproc \
            rsync \
            wget \
            unzip \
            python3 \
            zstd

      - name: Download OpenWrt 25.12 SDK
        run: |
          TARGET="${{ matrix.target }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}"
          # Discover the current SDK filename from the snapshot index
          SDK_FILE=$(wget -qO- "${BASE_URL}/" \
            | grep -oP 'openwrt-sdk[^"]*Linux-x86_64\.tar\.zst' \
            | head -1)
          echo "Downloading SDK: ${SDK_FILE}"
          wget -q "${BASE_URL}/${SDK_FILE}" -O sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Configure SDK feed
        working-directory: sdk
        run: |
          # Point the custom feed at this repository.
          # Only boinc and period-search will be installed (pla-util is excluded).
          echo "src-link custom ${{ github.workspace }}" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install boinc period-search

      - name: Compile packages
        working-directory: sdk
        run: |
          make defconfig
          make package/boinc/compile -j$(nproc) V=s
          make package/period-search/compile -j$(nproc) V=s

      - name: Collect built .apk files
        run: |
          mkdir -p dist
          find sdk/bin/packages -name "*.apk" -exec cp {} dist/ \;
          echo "Packages collected:"
          ls dist/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: warn

      - name: Test apk index generation
        if: matrix.arch == 'x86_64'
        run: |
          APK="$GITHUB_WORKSPACE/sdk/staging_dir/host/bin/apk"
          if [ ! -x "$APK" ]; then
            echo "ERROR: apk binary not found at $APK"
            exit 1
          fi
          echo "apk version: $("$APK" --version)"

          # Locate the APK signing public key produced by the SDK build system.
          # OpenWrt 25.x SDKs use public-key.pem / private-key.pem.
          # Older SDKs used key-build.pub / key-build.
          SDK="$GITHUB_WORKSPACE/sdk"
          KEY_PUB=""

          # 1. Modern name (OpenWrt 25.x+)
          [ -f "$SDK/public-key.pem" ] && KEY_PUB="$SDK/public-key.pem"
          # 2. Legacy name
          [ -z "$KEY_PUB" ] && [ -f "$SDK/key-build.pub" ] && KEY_PUB="$SDK/key-build.pub"
          # 3. Derive from modern private key
          if [ -z "$KEY_PUB" ] && [ -f "$SDK/private-key.pem" ]; then
            echo "Deriving public key from private-key.pem..."
            openssl pkey -in "$SDK/private-key.pem" -pubout -out "$SDK/public-key.pem" \
              || openssl rsa  -in "$SDK/private-key.pem" -pubout -out "$SDK/public-key.pem"
            [ -f "$SDK/public-key.pem" ] && KEY_PUB="$SDK/public-key.pem"
          fi
          # 4. Derive from legacy private key
          if [ -z "$KEY_PUB" ] && [ -f "$SDK/key-build" ]; then
            echo "Deriving public key from key-build..."
            openssl rsa  -in "$SDK/key-build" -pubout -out "$SDK/key-build.pub" \
              || openssl pkey -in "$SDK/key-build" -pubout -out "$SDK/key-build.pub"
            [ -f "$SDK/key-build.pub" ] && KEY_PUB="$SDK/key-build.pub"
          fi

          if [ -z "$KEY_PUB" ]; then
            echo "ERROR: Could not locate the SDK signing key."
            echo "=== sdk/ root listing ==="
            ls -la "$SDK/" || true
            exit 1
          fi

          echo "Using signing key: $KEY_PUB"
          mkdir -p /tmp/apkroot/etc/apk/keys
          cp "$KEY_PUB" /tmp/apkroot/etc/apk/keys/

          mkdir -p /tmp/apktest
          find dist/ -name "*.apk" -exec cp {} /tmp/apktest/ \;
          (cd /tmp/apktest && "$APK" --root /tmp/apkroot index \
            --rewrite-arch x86_64 -o APKINDEX.tar.gz *.apk)
          echo "APKINDEX generated successfully:"
          ls -lh /tmp/apktest/
